[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openbenchmarks-document-processing"
version = "0.1.0"
description = "Reproducible document parsing benchmark runner from OpenBenchmarks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "OpenBenchmarks"}]
dependencies = [
  "python-dotenv>=1.0,<2",
  "huggingface-hub>=0.34,<2",
  "openai>=2.50,<3",
  "requests>=2.32,<3",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
vendors = [
  "boto3>=1.38,<2",
  "llama-cloud>=2.16,<3",
  "reducto>=0.24,<1",
  "extend-ai>=1.19,<2",
]
dev = ["pytest>=8,<10"]

[project.scripts]
openbench-document-processing = "openbenchmarks_document_processing.cli:main"

[project.urls]
Leaderboard = "https://openbenchmarks.com/document-processing"
Repository = "https://github.com/openbenchmarks-labs/document-processing"
Dataset = "https://huggingface.co/datasets/openbenchmarks/OB-LegalQA"

[tool.hatch.build.targets.wheel]
packages = ["src/openbenchmarks_document_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
